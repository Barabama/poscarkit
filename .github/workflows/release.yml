name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.9.2, leave empty to use pyproject.toml version)'
        required: false
        type: string
      publish_pypi:
        description: 'Publish to PyPI'
        required: true
        type: boolean
        default: false
      build_executable:
        description: 'Build executable with Nuitka'
        required: true
        type: boolean
        default: true
      create_release:
        description: 'Create GitHub Release'
        required: true
        type: boolean
        default: true
      test_first:
        description: 'Run tests before release'
        required: true
        type: boolean
        default: false

# A tag push and a manual dispatch for the same version must not race.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag push is the whole release trigger, so the tag and pyproject.toml
  # must agree before anything is built.  A mismatch would otherwise publish
  # a release under a tag that does not exist.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check tag matches pyproject version
        if: github.event_name == 'push'
        run: |
          PYVER=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" != "v$PYVER" ]; then
            echo "::error::Tag $TAG does not match pyproject.toml version $PYVER. Bump pyproject.toml on main, then re-tag."
            exit 1
          fi
          echo "Tag $TAG matches pyproject.toml version $PYVER"

  test:
    needs: [validate]
    # Tag pushes always run the suite; manual dispatches opt in.
    if: github.event_name == 'push' || inputs.test_first
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          pytest tests/ -v --tb=short 2>&1 | tee pytest.log

      # Logs are not readable without admin access, but annotations are.  On
      # failure, surface each failing test as an annotation so the failure is
      # visible from the API and the run summary.
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR) " pytest.log | while IFS= read -r line; do
            echo "::error title=pytest::$line"
          done
          tail -n 40 pytest.log

  build-wheel:
    needs: [validate, test]
    if: always() && needs.validate.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build package
        run: |
          python -m build

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-wheel
          path: dist/
          retention-days: 7

  build-exe-windows:
    needs: [validate, test]
    if: (github.event_name == 'push' || inputs.build_executable) && always() && needs.validate.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $pyver = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ("${{ inputs.version }}" -ne "") {
            if ("${{ inputs.version }}" -ne $pyver) {
              Write-Error "Release version ${{ inputs.version }} differs from pyproject.toml version $pyver. Bump pyproject.toml on main first so wheel/exe/tag stay consistent."
              exit 1
            }
            echo "version=${{ inputs.version }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "version=$pyver" >> $env:GITHUB_OUTPUT
          }

      - name: Bake version into source
        shell: pwsh
        run: |
          Set-Content -Path src/config/_version.py -Value "__version__ = '${{ steps.version.outputs.version }}'"

      - name: Build executable with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: main.py
          mode: onefile
          onefile-tempdir-spec: "{CACHE_DIR}/nuitka/onefile"
          output-dir: dist
          output-file: poscarkit-${{ steps.version.outputs.version }}-win-x64.exe
          product-name: poscarkit
          product-version: ${{ steps.version.outputs.version }}
          file-description: POSCAR modeling tool
          company-name: MCMF, Fuzhou University
          copyright: "(C) 2025 MCMF, Fuzhou University"
          windows-icon-from-ico: src/gui/poscarkit.ico
          enable-plugins: tk-inter
          include-package: pandas
          windows-console-mode: disable
          nofollow-import-to: matplotlib.tests,pandas.tests,pytest,setuptools.tests

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: exe-windows
          path: dist/*.exe
          retention-days: 7
          if-no-files-found: warn

  build-exe-linux:
    needs: [validate, test]
    if: (github.event_name == 'push' || inputs.build_executable) && always() && needs.validate.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Get version
        id: version
        run: |
          PYVER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ -n "${{ inputs.version }}" ]; then
            if [ "${{ inputs.version }}" != "$PYVER" ]; then
              echo "::error::Release version ${{ inputs.version }} differs from pyproject.toml version $PYVER. Bump pyproject.toml on main first so wheel/exe/tag stay consistent."
              exit 1
            fi
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=$PYVER" >> $GITHUB_OUTPUT
          fi

      - name: Bake version into source
        run: |
          echo "__version__ = '${{ steps.version.outputs.version }}'" > src/config/_version.py

      - name: Build executable with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: main.py
          mode: onefile
          onefile-tempdir-spec: "{CACHE_DIR}/nuitka/onefile"
          output-dir: dist
          output-file: poscarkit-${{ steps.version.outputs.version }}-linux-x64
          product-name: poscarkit
          product-version: ${{ steps.version.outputs.version }}
          file-description: POSCAR modeling tool
          company-name: MCMF, Fuzhou University
          enable-plugins: tk-inter
          include-package: pandas
          windows-console-mode: disable
          nofollow-import-to: matplotlib.tests,pandas.tests,pytest,setuptools.tests

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: exe-linux
          path: dist/poscarkit-*
          retention-days: 7
          if-no-files-found: warn

  publish-pypi:
    needs: [build-wheel]
    # Never publish to PyPI from a tag push; that stays a deliberate action.
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/poscarkit
    permissions:
      id-token: write
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-wheel
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  create-release:
    needs: [validate, build-wheel, build-exe-windows, build-exe-linux]
    if: (github.event_name == 'push' || inputs.create_release) && always() && needs.validate.result == 'success' && (needs.build-wheel.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-wheel
          path: dist/
        continue-on-error: true

      - name: Download Windows executable
        if: needs.build-exe-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: exe-windows
          path: dist/

      - name: Download Linux executable
        if: needs.build-exe-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: exe-linux
          path: dist/

      - name: Get version
        id: version
        run: |
          PYVER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ -n "${{ inputs.version }}" ]; then
            if [ "${{ inputs.version }}" != "$PYVER" ]; then
              echo "::error::Release version ${{ inputs.version }} differs from pyproject.toml version $PYVER. Bump pyproject.toml on main first so wheel/exe/tag stay consistent."
              exit 1
            fi
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=$PYVER" >> $GITHUB_OUTPUT
          fi

      - name: List release files
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: poscarkit v${{ steps.version.outputs.version }}
          generate_release_notes: true
          # Prepended to the notes GitHub generates from the commits since the
          # previous release.
          body: |
            ## Installation

            ```bash
            pip install poscarkit==${{ steps.version.outputs.version }}
            ```

            Or download the standalone executable for your platform below
            (Windows `-win-x64.exe`, Linux `-linux-x64`). No Python required.

            **Upgrading from v0.10.7 or earlier:** sliced layer output changes.
            Layers are now identified by clustering the projection onto the
            surface normal and splitting at real gaps instead of rounding to a
            fixed number of decimal places. Previously a thermally broadened
            layer (~0.07 A wide) was split into several fragments, and (110) /
            (111) were cut with a non-commensurate cell. Re-run `slice` on any
            structure processed with an older version; re-grouping the old
            output will not recover the correct layers.
          files: dist/*
          draft: false
          prerelease: false
